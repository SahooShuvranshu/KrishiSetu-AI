<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Neo-Brutalist Badge Background -->
  <rect x="7" y="7" width="88" height="88" rx="18" fill="#000000" />
  <rect x="4" y="4" width="88" height="88" rx="18" fill="#CCFF00" stroke="#000000" stroke-width="4" />

  <!-- Exhaust Pipe -->
  <path d="M68 42 L68 24 C68 21 71 19 74 21" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  <ellipse cx="68" cy="24" rx="2.5" ry="1.5" fill="#000000" />

  <!-- Cab Roof -->
  <rect x="32" y="21" width="30" height="6" rx="2.5" fill="#000000" />

  <!-- Cab Frame & Windows -->
  <path d="M37 46 L40 26 L58 26 L60 46" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="42,29 56,29 57,43 39,43" fill="#000000" fill-opacity="0.18" />

  <!-- Rear Fender / Mudguard Arc -->
  <path d="M12 60 C12 43 21 38 39 40" stroke="#000000" stroke-width="7" stroke-linecap="round" />

  <!-- Engine Hood / Chassis Body -->
  <path d="M39 43 L73 43 C77 43 79 46 80 49 L83 57 C84 61 81 65 77 65 L39 65 Z" fill="#14532D" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

  <!-- Headlight (Vibrant White Beam) -->
  <polygon points="79,47 84,49 83,55 78,53" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />

  <!-- Hood Grille Lines -->
  <line x1="61" y1="48" x2="61" y2="56" stroke="#CCFF00" stroke-width="2.5" stroke-linecap="round" />
  <line x1="66" y1="48" x2="66" y2="56" stroke="#CCFF00" stroke-width="2.5" stroke-linecap="round" />
  <line x1="71" y1="48" x2="71" y2="56" stroke="#CCFF00" stroke-width="2.5" stroke-linecap="round" />

  <!-- Front Axle -->
  <rect x="68" y="62" width="10" height="5" fill="#000000" />

  <!-- Rear Massive Wheel -->
  <circle cx="32" cy="63" r="19" fill="#000000" />
  <!-- Tire Rims with High Contrast Cyber Lime -->
  <circle cx="32" cy="63" r="13" fill="#CCFF00" stroke="#000000" stroke-width="3.5" />
  <circle cx="32" cy="63" r="6" fill="#000000" />
  <circle cx="32" cy="63" r="2.5" fill="#CCFF00" />

  <!-- Front Wheel -->
  <circle cx="75" cy="68" r="12" fill="#000000" />
  <circle cx="75" cy="68" r="7.5" fill="#CCFF00" stroke="#000000" stroke-width="2.5" />
  <circle cx="75" cy="68" r="3" fill="#000000" />

  <!-- Ground Soil Line -->
  <line x1="14" y1="84" x2="86" y2="84" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6" />
</svg>
